name: Release

# Push a tag such as v2.0.0 to build and attach downloads to a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            experimental: false
          - os: macos-latest
            experimental: true   # unsigned; users need Open Anyway on macOS 15+
          - os: ubuntu-22.04
            experimental: true   # X11 sessions only
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -r requirements.txt "pyinstaller>=6,<7"

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: |
          pyinstaller --noconfirm main.spec
          Compress-Archive -Path dist/* -DestinationPath AdaptiveUI-windows.zip
          (Get-FileHash AdaptiveUI-windows.zip -Algorithm SHA256).Hash | Out-File AdaptiveUI-windows.zip.sha256

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          pyinstaller --noconfirm --windowed --name AdaptiveUI --collect-data customtkinter \
            --hidden-import pynput.keyboard._darwin --hidden-import pynput.mouse._darwin main.py
          hdiutil create -volname AdaptiveUI -srcfolder dist/AdaptiveUI.app -ov -format UDZO AdaptiveUI-macos.dmg
          shasum -a 256 AdaptiveUI-macos.dmg > AdaptiveUI-macos.dmg.sha256

      - name: Build (Linux AppImage)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y python3-tk
          pyinstaller --noconfirm --onedir --name AdaptiveUI --collect-data customtkinter \
            --hidden-import pynput.keyboard._xorg --hidden-import pynput.mouse._xorg main.py
          mkdir -p AppDir/usr/bin
          cp -r dist/AdaptiveUI/* AppDir/usr/bin/
          python -c "import theme; theme.tray_icon_image('FOCUS', 256).save('AppDir/adaptive-ui.png')"
          printf '[Desktop Entry]\nType=Application\nName=Adaptive UI Engine\nExec=AdaptiveUI\nIcon=adaptive-ui\nCategories=Utility;\n' > AppDir/adaptive-ui.desktop
          printf '#!/bin/sh\nHERE="$(dirname "$(readlink -f "$0")")"\nexec "$HERE/usr/bin/AdaptiveUI" "$@"\n' > AppDir/AppRun
          chmod +x AppDir/AppRun
          curl -L -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 ./appimagetool AppDir AdaptiveUI-linux-x86_64.AppImage
          sha256sum AdaptiveUI-linux-x86_64.AppImage > AdaptiveUI-linux-x86_64.AppImage.sha256

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            AdaptiveUI-*
